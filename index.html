<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>おかね全体マップ</title>
<meta name="theme-color" content="#14432F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おかねマップ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF3EF; --surface:#FFFFFF; --ink:#17231D; --muted:#5F6F67;
    --line:#DDE6E0; --pine:#14432F; --save:#159E56;
    --c-shared:#4C9BE0; --c-personal:#E0A32E; --c-subs:#A46FC4; --c-save:#16A34A;
    --warn:#C0492F;
    --jp:'Zen Kaku Gothic New',system-ui,sans-serif;
    --num:'Outfit',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--jp);
    line-height:1.6; -webkit-font-smoothing:antialiased;
    padding:calc(20px + env(safe-area-inset-top)) 16px 40px; max-width:520px; margin:0 auto;
  }
  header{margin-bottom:22px}
  .title{font-size:24px; font-weight:900; letter-spacing:.01em}
  .subtitle{font-size:13px; color:var(--muted); margin-top:4px}

  .card{
    background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:18px; margin-bottom:14px;
  }
  .card-head{font-size:13px; font-weight:700; color:var(--pine); margin-bottom:14px}

  .field{display:flex; align-items:center; gap:10px; padding:10px 0}
  .field + .field{border-top:1px solid var(--line)}
  .dot{width:10px; height:10px; border-radius:50%; flex:none}
  .field-label{flex:1; min-width:0}
  .field-name{font-size:15px; font-weight:500}
  .field-src{font-size:11px; color:var(--muted); margin-top:1px}
  .input-wrap{display:flex; align-items:center; gap:4px}
  .yen{font-size:14px; color:var(--muted); font-family:var(--num); font-weight:600}
  input{
    width:118px; text-align:right; border:none; border-bottom:2px solid var(--line);
    background:transparent; font-family:var(--num); font-size:19px; font-weight:600;
    color:var(--ink); padding:4px 2px; outline:none;
  }
  input:focus{border-bottom-color:var(--pine)}

  .result{
    background:var(--pine); color:#fff; border-radius:20px; padding:22px 20px;
    margin-bottom:14px;
  }
  .result-label{font-size:13px; color:#B6D0C2; font-weight:500}
  .hero-num{
    font-family:var(--num); font-weight:800; font-size:44px; line-height:1.05;
    margin:2px 0 2px; letter-spacing:-.01em;
  }
  .hero-num.neg{color:#F4B4A4}
  .hero-sub{font-size:12.5px; color:#9FBEAE}
  .hero-warn{font-size:13px; color:#F4C0B0; font-weight:500; margin-top:6px}

  .chart-row{display:flex; align-items:center; gap:18px; margin-top:20px;
    padding-top:20px; border-top:1px solid rgba(255,255,255,.14)}
  .donut{flex:none; position:relative; width:132px; height:132px}
  .donut svg{transform:rotate(-90deg)}
  .donut-center{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center}
  .donut-pct{font-family:var(--num); font-weight:700; font-size:26px; line-height:1}
  .donut-cap{font-size:10px; color:#9FBEAE; margin-top:2px}
  .legend{flex:1; display:flex; flex-direction:column; gap:9px}
  .leg-item{display:flex; align-items:center; gap:8px; font-size:12.5px}
  .leg-dot{width:9px;height:9px;border-radius:2px;flex:none}
  .leg-name{color:#D6E6DD; flex:1}
  .leg-val{font-family:var(--num); font-weight:600; color:#fff}

  .stats{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .stat{background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:14px 16px}
  .stat-cap{font-size:11.5px; color:var(--muted)}
  .stat-num{font-family:var(--num); font-weight:700; font-size:21px; margin-top:3px}

  .note{font-size:11.5px; color:var(--muted); text-align:center; margin-top:18px;
    line-height:1.7}
</style>
</head>
<body>
  <header>
    <div class="title">おかね全体マップ</div>
    <div class="subtitle">3つのアプリの今月の合計を入れると、貯金にまわせる額が見えます</div>
  </header>

  <div class="card">
    <div class="card-head">今月の収入（手取り）</div>
    <div class="field">
      <span class="dot" style="background:var(--save)"></span>
      <div class="field-label">
        <div class="field-name">収入</div>
        <div class="field-src">お給料など、入ってくるお金の合計</div>
      </div>
      <div class="input-wrap"><span class="yen">¥</span>
        <input id="income" inputmode="numeric" placeholder="0"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">今月の支出</div>
    <div class="field">
      <span class="dot" style="background:var(--c-shared)"></span>
      <div class="field-label">
        <div class="field-name">共通生活費</div>
        <div class="field-src">シェアルーの合計</div>
      </div>
      <div class="input-wrap"><span class="yen">¥</span>
        <input id="shared" inputmode="numeric" placeholder="0"></div>
    </div>
    <div class="field">
      <span class="dot" style="background:var(--c-personal)"></span>
      <div class="field-label">
        <div class="field-name">個人の支出</div>
        <div class="field-src">毎日家計簿の合計</div>
      </div>
      <div class="input-wrap"><span class="yen">¥</span>
        <input id="personal" inputmode="numeric" placeholder="0"></div>
    </div>
    <div class="field">
      <span class="dot" style="background:var(--c-subs)"></span>
      <div class="field-label">
        <div class="field-name">サブスク</div>
        <div class="field-src">サブスクBoxの合計</div>
      </div>
      <div class="input-wrap"><span class="yen">¥</span>
        <input id="subs" inputmode="numeric" placeholder="0"></div>
    </div>
  </div>

  <div class="result">
    <div class="result-label">今月、貯金にまわせる額</div>
    <div class="hero-num" id="savingNum">¥0</div>
    <div class="hero-sub" id="heroSub">収入と支出を入れると計算されます</div>
    <div class="hero-warn" id="heroWarn" style="display:none"></div>

    <div class="chart-row">
      <div class="donut">
        <svg width="132" height="132" viewBox="0 0 132 132" id="donutSvg">
          <circle cx="66" cy="66" r="52" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="20"/>
        </svg>
        <div class="donut-center">
          <div class="donut-pct" id="rate">0%</div>
          <div class="donut-cap">貯金にまわる<br>割合</div>
        </div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-cap">支出の合計</div>
      <div class="stat-num" id="totalExp">¥0</div>
    </div>
    <div class="stat">
      <div class="stat-cap">この調子だと1年で</div>
      <div class="stat-num" id="yearly">¥0</div>
    </div>
  </div>

  <div class="note">
    入力したお金はこの端末にだけ保存されます。<br>毎月、数字を入れ替えて使ってください。
  </div>

<script>
  const R = 52, C = 2 * Math.PI * R;
  const cats = [
    {id:'shared',   name:'共通生活費', color:'#4C9BE0'},
    {id:'personal', name:'個人の支出', color:'#E0A32E'},
    {id:'subs',     name:'サブスク',   color:'#A46FC4'},
  ];
  const ids = ['income','shared','personal','subs'];
  const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');

  function num(id){
    const v = document.getElementById(id).value.replace(/[^0-9]/g,'');
    return v ? parseInt(v,10) : 0;
  }

  function save(){
    const data = {};
    ids.forEach(id => data[id] = num(id));
    try { localStorage.setItem('okane:v1', JSON.stringify(data)); } catch(e){}
  }

  function load(){
    try {
      const raw = localStorage.getItem('okane:v1');
      if (raw){
        const d = JSON.parse(raw);
        ids.forEach(id => { if (d[id]) document.getElementById(id).value = d[id]; });
      }
    } catch(e){}
    render();
  }

  function render(){
    const income = num('income');
    const parts = cats.map(c => ({...c, val: num(c.id)}));
    const totalExp = parts.reduce((s,p)=>s+p.val, 0);
    const saving = income - totalExp;

    document.getElementById('totalExp').textContent = yen(totalExp);

    const heroEl = document.getElementById('savingNum');
    const subEl = document.getElementById('heroSub');
    const warnEl = document.getElementById('heroWarn');
    heroEl.textContent = yen(saving);
    heroEl.classList.toggle('neg', saving < 0);

    if (income === 0 && totalExp === 0){
      subEl.textContent = '収入と支出を入れると計算されます';
      warnEl.style.display = 'none';
    } else if (saving < 0){
      subEl.textContent = '';
      warnEl.style.display = 'block';
      warnEl.textContent = '支出が収入を ' + yen(-saving) + ' 超えています。どこを減らせるか見てみましょう。';
    } else {
      const rate = income > 0 ? Math.round(saving/income*100) : 0;
      subEl.textContent = '収入の ' + rate + '% を貯金にまわせています';
      warnEl.style.display = 'none';
    }

    document.getElementById('yearly').textContent = saving > 0 ? yen(saving*12) : '¥0';

    const rate = income > 0 ? Math.max(0, Math.round(saving/income*100)) : 0;
    document.getElementById('rate').textContent = rate + '%';

    const svg = document.getElementById('donutSvg');
    svg.querySelectorAll('.seg').forEach(el => el.remove());

    const segs = [...parts];
    if (saving > 0) segs.push({name:'貯金', color:'#16A34A', val:saving});
    const base = income > 0 ? income : totalExp;
    let offset = 0;
    if (base > 0){
      segs.forEach(s => {
        if (s.val <= 0) return;
        const frac = s.val / base;
        const len = frac * C;
        const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
        circle.setAttribute('class','seg');
        circle.setAttribute('cx','66'); circle.setAttribute('cy','66');
        circle.setAttribute('r', R); circle.setAttribute('fill','none');
        circle.setAttribute('stroke', s.color);
        circle.setAttribute('stroke-width','20');
        circle.setAttribute('stroke-dasharray', `${len} ${C-len}`);
        circle.setAttribute('stroke-dashoffset', `${-offset}`);
        svg.appendChild(circle);
        offset += len;
      });
    }

    const legend = document.getElementById('legend');
    const legItems = [...parts];
    if (saving > 0) legItems.push({name:'貯金にまわる', color:'#16A34A', val:saving});
    legend.innerHTML = legItems.map(s => `
      <div class="leg-item">
        <span class="leg-dot" style="background:${s.color}"></span>
        <span class="leg-name">${s.name}</span>
        <span class="leg-val">${yen(s.val)}</span>
      </div>`).join('');
  }

  ids.forEach(id => {
    document.getElementById(id).addEventListener('input', () => { render(); save(); });
  });

  load();
</script>
</body>
</html>
